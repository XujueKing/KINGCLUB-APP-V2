name: iOS compile check

# Manual until the first macOS build has been reviewed. No signing secrets needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      FLUTTER_REVISION: 6655482ec06e547f90abf8ae7590466f4415978d
      FLUTTER_VERSION: 3.47.1
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the same Flutter revision as development
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          test "$(git -C "$RUNNER_TEMP/flutter" describe --tags --exact-match)" = "$FLUTTER_VERSION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios

      - name: Report toolchain and resolve locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          {
            xcodebuild -version
            flutter --version
            flutter pub get --enforce-lockfile
          } 2>&1 | tee build/ci/ios-dependencies.log

      - name: Apply reviewed iOS avatar cropper controls workaround
        run: python3 scripts/patch_ios_avatar_cropper.py

      - name: Compile device application without signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          flutter build ios --release --no-codesign 2>&1 | tee build/ci/ios-compile.log

      - name: Keep compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-compile-${{ github.run_id }}
          path: build/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
