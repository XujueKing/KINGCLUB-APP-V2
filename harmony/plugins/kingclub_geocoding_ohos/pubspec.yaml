name: kingclub_geocoding_ohos
description: KINGCLUB HarmonyOS system geocoding adapter.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  geocoding_platform_interface: ^5.0.0
flutter:
  plugin:
    implements: geocoding
    platforms:
      ohos:
        package: com.lingmei.kingclub.geocoding
        pluginClass: KingclubGeocodingPlugin
        dartPluginClass: KingclubGeocodingFactory
