<title>KINGCLUB 预订与组局设计</title>
<style>
:root{color-scheme:dark;--bg:#111;--card:#202020;--gold:#cebea4;--muted:#aaa;--line:#383838}*{box-sizing:border-box}body{margin:0;background:#151515;color:#fff;font:16px/1.5 'Microsoft YaHei','PingFang SC',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.shell{display:grid;grid-template-columns:220px 390px minmax(260px,420px);gap:36px;justify-content:center;padding:32px}.side h1{font-size:22px;margin:0 0 8px}.small{font-size:13px;color:var(--muted)}.side nav{display:grid;gap:6px;margin-top:24px}.side nav button{text-align:left;border:0;background:none;color:#aaa;padding:12px;border-radius:12px}.side nav button.selected{background:#30302d;color:#fff}.side label{display:block;color:#807b73;font-size:12px;margin:18px 12px 4px}.phone{height:844px;background:var(--bg);border:1px solid #333;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px #0006}.status{height:44px;padding:12px 24px 0;font-weight:600;display:flex;justify-content:space-between;font-size:14px}.header{height:56px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;background:transparent;font-size:17px;font-weight:600}.header button{position:absolute;left:8px;top:4px;height:48px;width:48px;background:transparent;border:0;color:var(--gold);font-size:30px}.header .right{position:absolute;right:20px;font-size:14px;color:var(--gold)}.body{overflow:auto;flex:1;padding:12px 16px 24px;scrollbar-width:none}.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px}.card.tight{padding:16px}.cover{height:150px;position:relative;background:linear-gradient(120deg,#332b25,#1c171a);border-radius:12px;overflow:hidden;margin:-4px -4px 14px}.cover img{width:100%;height:100%;object-fit:cover;opacity:.67}.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#0009)}.cover .tag{position:absolute;z-index:1;left:12px;bottom:12px;color:white;background:#0007}.tag{display:inline-block;padding:4px 8px;font-size:12px;border-radius:6px;background:#343027;color:var(--gold)}h2{font-size:20px;margin:0 0 8px;font-weight:600}h3{font-size:17px;margin:0 0 10px;font-weight:600}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}.row label,.row span{min-width:0}.value{text-align:right}.money{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}.money.big{font-size:34px}.gold{color:var(--gold)}.sep{border-bottom:1px solid var(--line);margin:10px 0}.tabs{display:flex;gap:24px;margin:12px 4px 18px}.tabs button{padding:4px 0 10px;color:#aaa;background:none;border:0;font-size:17px}.tabs .active{color:#fff;border-bottom:2px solid #fff}.search{background:#303030;border-radius:12px;padding:14px 16px;font-size:15px;color:#aaa}.btn{background:var(--gold);color:#111;border:0;border-radius:26px;min-height:52px;padding:12px 22px;font-weight:600;width:100%;font-size:17px}.btn.secondary{background:#333;color:white}.btn.outline{background:none;color:var(--gold);border:1px solid var(--gold)}.buttons{display:flex;gap:12px}.buttons .btn{min-width:0}.footer{padding:16px 20px 28px;background:var(--bg);border-top:1px solid #2b2b2b;display:flex;align-items:center;gap:16px}.footer .btn{flex:1}.field{width:100%;border:0;background:#303030;color:#fff;padding:14px 16px;border-radius:12px;min-height:52px;margin:10px 0}.field::placeholder{color:#a3a3a3}.step{display:flex;gap:6px;margin:4px 0 24px}.step i{height:3px;flex:1;background:#333}.step i:first-child{background:var(--gold)}.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pillrow button{background:#303030;border:0;color:#ddd;padding:10px 14px;border-radius:10px}.pillrow button.active{background:#494235;color:#fff;box-shadow:inset 0 0 0 1px var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.grid .card button{text-align:left}.tile{color:#fff;background:var(--card);border:0;padding:18px;border-radius:16px;text-align:left;min-height:112px}.tile strong{display:block;font-size:17px;margin:12px 0 4px}.tile small{color:#aaa}.menu{border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;color:#fff;min-height:58px;display:flex;justify-content:space-between;align-items:center;font-size:17px}.menu:last-child{border:0}.identity{display:flex;align-items:center;gap:14px;margin:12px 8px 24px}.identity img{width:60px;height:60px;border-radius:50%}.identity .muted{margin-top:2px}.note{background:#24231f;border-left:2px solid var(--gold);padding:12px 14px;font-size:14px;color:#d4c9b6;margin:16px 0}.seats{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.seats i{height:22px;width:22px;border-radius:50%;background:#45433c}.seats i.filled{background:var(--gold)}.tick{width:70px;height:70px;border:3px solid #fff;border-radius:50%;margin:96px auto 28px;display:grid;place-items:center;font-size:42px}.center{text-align:center}.notes h2{font-size:21px;margin:0 0 20px}.notes p{font-size:15px;line-height:1.8;color:#c2c2c2}.notes .card{background:#1d1d1d}.notes ul{padding-left:20px;color:#aaa;font-size:14px;line-height:1.9}.check{display:flex;gap:10px;font-size:14px;align-items:flex-start}.check input{accent-color:var(--gold);margin-top:5px}.navfoot{display:flex;justify-content:space-around;border-top:1px solid #282828;padding:16px;color:#aaa;font-size:14px}.navfoot b{color:var(--gold)}.widephoto{height:190px;border-radius:12px;overflow:hidden;margin-bottom:20px;background:#2b2822}.widephoto img{width:100%;height:100%;object-fit:cover}.ledger{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:18px 0}.ledger strong{display:block;font-size:21px;margin:6px 0}.legend{font-size:12px;color:#807b73;margin-top:20px}@media(max-width:1120px){.shell{grid-template-columns:190px 390px;padding:24px;gap:24px}.notes{grid-column:1 / -1;max-width:604px}}@media(max-width:650px){.shell{display:flex;flex-direction:column;align-items:center;padding:16px;gap:20px}.side,.notes{width:min(390px,100%)}.side nav{display:flex;overflow:auto;white-space:nowrap}.side label{display:none}.phone{width:min(390px,100%);height:844px}.side h1{font-size:20px}}
</style>
<div class="shell">
 <aside class="side"><h1>KINGCLUB</h1><div class="small">预订与组局 · 页面设计</div><nav id="nav"></nav><p class="legend">交互和金额均为设计示例。<br>不提交订单，不收款。</p></aside>
 <section class="phone" aria-label="APP页面设计"><div class="status"><span>9:41</span><span>●●●  ▰</span></div><header class="header"><button id="back" aria-label="返回">‹</button><span id="title"></span></header><main class="body" id="body"></main><div id="footer"></div></section>
 <aside class="notes"><h2 id="noteTitle"></h2><div class="card" id="notes"></div><p class="small">使用当前APP的暗色卡片、白色标题和52高按钮。左侧切换角色与页面；页面内主要按钮可以走完示例流程。</p></aside>
</div>
<script>
const asset='../../../../../assets/legacy/', logo=asset+'messaging/notification_kingclub.png', photo=asset+'home/legacy_poster_party.webp';
const money=n=>new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const cover=(tag)=>`<div class="cover"><img src="${photo}" alt="沿用APP活动素材"><span class="tag">${tag}</span></div>`;
const menu=(name,target)=>`<button class="menu" data-go="${target}"><span>${name}</span><span class="gold">›</span></button>`;
const button=(text,target,type='')=>`<button class="btn ${type}" data-go="${target}">${text}</button>`;
const row=(name,value)=>`<div class="row"><span class="muted">${name}</span><span class="value">${value}</span></div>`;
const identity=`<div class="identity"><img src="${logo}" alt="示例头像"><div><h3 style="margin:0">示例合作者 <span class="tag">合作者</span></h3><div class="muted">合作等级 L5</div></div></div>`;
const pages={
 home:{group:'顾客',label:'首页入口',title:'KINGCLUB',html:()=>`${cover('同城发现')}<h2>今晚，一起玩</h2><p class="muted">湖南省 · 株洲市</p><div class="grid" style="margin-top:24px"><button class="tile" data-go="aa"><span class="gold">↗</span><strong>AA邀请</strong><small>挑一个局，一起玩</small></button><button class="tile" data-go="discover"><span class="gold">⌑</span><strong>吃喝玩乐</strong><small>选门店，订位置</small></button></div><div class="card" style="margin-top:24px"><h3>同城热门</h3><p class="muted">活动和位置由商家、合作者发布</p></div>`,notes:'保留首页原来的两个主要入口位置。普通会员首页只浏览、报名和预订，发布移入各自平台。收藏店铺的预订也走相同链路。'},
 aa:{group:'顾客',label:'AA邀请',title:'AA邀请',html:()=>`<div class="row"><span>株洲市 <span class="gold">⌄</span></span><span class="muted">10月17日 · 周六</span></div><div class="pillrow"><button class="active">今天</button><button>明天</button><button>周末</button><button>选择日期</button></div><div class="card" data-go="invitation" tabindex="0" role="button">${cover('合作者组局 · 指定卡座')}<h2>周末微醺，来认识新朋友</h2><p class="muted">示例门店 · V2卡座 · 20:00–02:00</p><div class="seats">${Array.from({length:10},(_,i)=>`<i class="${i<4?'filled':''}"></i>`).join('')}</div><div class="row"><span>已报名 4 / 10人</span><span class="money">¥100<span class="muted"> / 人</span></span></div></div><div class="card">${cover('商家官方 · 到店安排')}<h3>周末官方AA夜</h3><p class="muted">报名后由商家安排座位</p><div class="row"><span>男A女免</span><span class="money">¥100<span class="muted">起</span></span></div></div>`,notes:'编号卡座购买前可见，人数按成功报名计算。商家官方活动展示到店安排，不捏造具体桌号；后台仍需锁定可用资源池。'},
 discover:{group:'顾客',label:'吃喝玩乐',title:'吃喝玩乐',html:()=>`<div class="row"><span>株洲市 <span class="gold">⌄</span></span><span class="muted">10月17日 · 6人</span></div><div class="search">搜索门店或位置</div><div class="tabs"><button>全部</button><button>散台</button><button class="active">卡座</button><button>包厢</button></div><div class="card" data-go="product" tabindex="0" role="button">${cover('卡座 · 6–10人')}<h2>示例门店 · 微醺卡座</h2><p class="muted">核心商圈 · 周末营业至凌晨</p><div class="pillrow"><span class="tag">无最低消费</span><span class="tag">取消退定金</span></div><div class="row"><span class="muted">预订定金，可抵消费</span><span class="money">¥${money(100)}</span></div></div><div class="card">${cover('散台 · 2–4人')}<h3>示例门店 · 轻松散台</h3><div class="row"><span class="muted">无最低消费</span><span class="gold">免费预订</span></div></div>`,notes:'顾客先选择类型、日期和人数；产品卡同时解释现在付款和到店消费要求。免费预订与无最低消费是两种不同规则。没有上架产品时显示真实空态，不生成示例商品。'},
 product:{group:'顾客',label:'预订产品详情',title:'预订详情',html:()=>`<div class="widephoto"><img src="${photo}" alt="示例产品封面"></div><h2>微醺卡座 · 6–10人</h2><p class="muted">示例门店 · 株洲市</p><div class="card" style="margin-top:20px">${row('到店日期','10月17日 周六')}${row('预订时段','20:00–02:00')}${row('预订人数','6人')}</div><div class="card"><h3>选择位置</h3><div class="pillrow"><button class="active">V1 · 10人</button><button>V3 · 10人</button></div><p class="muted">仅显示当前可预订的位置</p></div><div class="card">${row('预订定金',`¥${money(100)}`)}${row('最低消费','无最低消费')}<div class="sep"></div><p class="muted">定金抵扣最终消费。取消退定金并释放位置；到店前4小时区分提前与临近取消。</p></div>`,footer:()=>`<span><small class="muted">定金</small><div class="money">¥100</div></span>${button('确认预订','confirm')}`,notes:'位置由真实可用资源返回。签约给合作者的桌台不进入商家公共预订库存。定金不是商品消费，不出酒，不自动记带局提成。'},
 confirm:{group:'顾客',label:'确认预订',title:'确认预订',html:()=>`<div class="card"><h3>示例门店</h3>${row('产品','微醺卡座')}${row('位置','V1 · 6人')}${row('到店时间','10月17日 20:00')}<div class="sep"></div>${row('定金',`¥${money(100)}`)}${row('最低消费','无最低消费')}</div><div class="card"><div class="row"><span>微信支付</span><span class="gold">›</span></div></div><p class="muted">定金用于抵扣最终消费。提前或不足4小时取消，均退定金、释放位置。</p><label class="check"><input type="checkbox" checked><span>我已阅读预订和取消规则</span></label><div class="note">此为设计示例，下一步只展示成功页，不调用支付。</div>`,footer:()=>`<span><small class="muted">应付定金</small><div class="money">¥100</div></span>${button('预览付款结果','success')}`,notes:'全页只保留一个主要操作。键盘打开时不把支付按钮推高。正式代码必须以服务端回执显示成功，免费预订不创建0元付款单。'},
 success:{group:'顾客',label:'预约详情',title:'我的预约',html:()=>`<div class="card"><span class="tag">已确认 · 设计示例</span><h2 style="margin-top:16px">示例门店</h2><p class="muted">微醺卡座 · V1</p><div class="sep"></div>${row('到店时间','10月17日 20:00')}${row('预订人数','6人')}${row('已付定金',`¥${money(100)}`)}</div><div class="card"><h3>到店使用</h3><p class="muted">出示预约凭证，收银员确认到店。已付定金在本次消费结账时抵扣一次。</p></div><div class="card">${row('有效取消截止','10月17日16:00')}<p class="muted">不足4小时取消也退定金并释放位置；未到店取消与消费退款分别处理。</p></div><div class="buttons">${button('返回发现','discover','outline')}${button('查看店铺','product')}</div>`,notes:'成功后进入可继续查看的预约详情，订单、剩余付款、位置和取消入口集中展示。APP消息卡也进入这里。'},
 invitation:{group:'顾客',label:'编号组局详情',title:'活动详情',html:()=>`${cover('合作者组局')}<h2>周末微醺，来认识新朋友</h2><p class="muted">示例门店 · 10月17日 20:00–02:00</p><div class="card" style="margin-top:20px"><h3>V2 卡座</h3><div class="ledger"><div><span class="muted">已报名</span><strong>4</strong></div><div><span class="muted">已到店</span><strong>0</strong></div><div><span class="muted">总席位</span><strong>10</strong></div></div><p class="muted">成功报名后，你就是第5位。</p></div><div class="card"><h3>套餐与参加要求</h3><p>共享酒水套餐 · AA</p><p class="muted">已匹配 · 名额与价格在付款时再次确认</p></div><div class="card"><h3>发布者</h3>${identity}</div>`,footer:()=>`<span class="money">¥100<span class="muted"> / 人</span></span>${button('预览报名','partyConfirm')}`,notes:'编号、已报名和已到店分别展示。第11个抢10人桌必须售罄且不扣款。合同到期或失效不能发布新场次，不能侵害已经付款的顾客权益。'},
 partyConfirm:{group:'顾客',label:'确认活动报名',title:'确认报名',html:()=>`<div class="card"><h3>周末微醺，来认识新朋友</h3>${row('门店与位置','示例门店 · V2')}${row('参加时间','10月17日 20:00')}${row('席位','1人 · AA')}${row('活动费用','¥100.00')}<p class="muted">此为活动参加费用，位置和价格以付款时确认结果为准。</p></div><div class="note">设计示例，不付款、不占席位。</div>`,footer:()=>button('返回活动详情','invitation','outline'),notes:'活动报名费与顾客预订定金分别解释和记账，不复用定金文案。'},
 merchant:{group:'商家',label:'商家平台',title:'商家平台',html:()=>`<div class="card"><h2>示例门店</h2><p class="muted">株洲市 · CNY</p><span class="tag">经营管理</span></div><div class="grid"><button class="tile" data-go="products"><span class="gold">⌑</span><strong>预订产品</strong><small>散台 · 卡座 · 包厢</small></button><button class="tile" data-go="publish"><span class="gold">＋</span><strong>发布AA邀请</strong><small>招募后统一安排</small></button><button class="tile" data-go="contracts"><span class="gold">□</span><strong>卡座合作任务</strong><small>整月独占签约</small></button><button class="tile" data-go="desk"><span class="gold">≡</span><strong>预约与排位</strong><small>到店 · 分座 · 核销</small></button></div><div class="card" style="margin-top:20px">${menu('费率与收益规则','contract')}${menu('采购审批 / 清单','merchant')}${menu('其它商家任务','contracts')}</div>`,notes:'从我的商家平台进入，不在普通会员首页显示发布按钮。授权门店由服务器决定。后台业务能力分别接真实过程，页面入口不是完成交易的证据。'},
 products:{group:'商家',label:'预订产品管理',title:'预订产品',html:()=>`<div class="tabs"><button class="active">已上架</button><button>草稿</button><button>已下架</button></div><div class="card">${cover('已上架 · 卡座')}<h3>微醺卡座</h3>${row('位置范围','V1、V3')}${row('预订方式','定金 ¥100.00')}${row('消费要求','无最低消费')}<div class="buttons" style="margin-top:12px">${button('预览','product','outline')}${button('编辑','editor')}</div></div><div class="note">V2已签约给合作者，不在公共产品可售位置中。</div>`,footer:()=>button('新增预订产品','editor'),notes:'产品有自己版本，修改价格和取消规则不改写已成交订单。位置类别显式维护，不用桌号前缀推断卡座或散台。'},
 editor:{group:'商家',label:'产品编辑',title:'编辑预订产品',html:()=>`<div class="step"><i></i><i></i><i></i><i></i></div><h2>位置与预订方式</h2><p class="muted">1 / 4 · 先告诉顾客可以预订什么</p><div class="card" style="margin-top:20px"><h3>位置类型</h3><div class="pillrow"><button>散台</button><button class="active">卡座</button><button>包厢</button></div>${row('所属门店','示例门店')}<input class="field" value="微醺卡座" aria-label="产品名称">${row('可售位置','V1、V3 · 各10人')}</div><div class="card"><h3>预订方式</h3><div class="pillrow"><button>免费预订</button><button class="active">支付定金</button></div><input class="field" inputmode="decimal" value="100.00" aria-label="预订定金">${row('最低消费','无最低消费')}<p class="muted">定金抵消费，取消退定金并释放位置</p></div>`,footer:()=>button('预览产品','product'),notes:'后续步骤是图片介绍、日期时段、预览上架。编辑样式无边框输入；数字软键盘。最低消费、预订定金和当晚消费分别说明。'},
 publish:{group:'商家',label:'官方活动发布',title:'发布AA邀请',html:()=>`<div class="step"><i></i><i></i><i></i><i></i><i></i></div><h2>选场地，定时间</h2><p class="muted">1 / 5 · 门店官方发起</p><div class="card" style="margin-top:24px">${row('发布门店','示例门店')}${row('活动开始','10月17日 20:00')}${row('活动结束','10月18日 02:00')}<div class="sep"></div>${row('分座方式','报名后由商家安排')}<p class="muted">只从商家可用位置池分配，不占已签约卡座。</p></div><div class="card"><h3>活动方式</h3><div class="pillrow"><button class="active">AA</button><button>男A女免</button><button>全免费</button></div><input class="field" placeholder="活动主题" aria-label="活动主题"></div>`,footer:()=>button('预览邀请','aa'),notes:'官方身份固定，不提供自行开关。盲盒是购买前不披露位置，不是不限量报名；后台仍需选择实际资源池。免费活动也生成真实报名权益。'},
 contracts:{group:'商家 / 合作者',label:'卡座合作任务',title:'卡座合作任务',html:()=>`<div class="row"><span>株洲市 <span class="gold">⌄</span></span><span class="muted">2026年11月</span></div><div class="card" style="margin-top:12px"><span class="tag">整月独占</span><h2 style="margin-top:16px">V2卡座 · 10人</h2><p class="muted">示例门店</p>${row('签约月份','11月1日–12月1日')}${row('资金门槛','保证金 ¥1,000.00')}${row('收取方','平台收取')}<div class="sep"></div><p class="muted">默认等级收益规则；完成目标后按合同退回资金</p>${button('查看合同','contract')}</div><div class="card"><span class="tag">无资金门槛</span><h3 style="margin-top:16px">V3卡座 · 8人</h3><p class="muted">商家自行设置任务条件和收益规则</p></div>`,notes:'同一编号位置整月只能属于一个有效合同。正式签约前检查已有合同、预约和活动；不能取消已有顾客来腾位置。'},
 contract:{group:'商家 / 合作者',label:'合同详情',title:'卡座合作详情',html:()=>`<div class="card"><h2>V2卡座 · 10人</h2><p class="muted">示例门店 · 株洲市</p><span class="tag">2026年11月 · 整月独占</span></div><div class="card"><h3>资金和收益</h3>${row('资金类型','保证金')}${row('金额','¥1,000.00')}${row('收取方','平台')}${row('带局规则','默认等级费率，可授权调整')}<p class="muted">推荐收益从对应顾客的带局份额拆出，不重复奖励。</p></div><div class="card"><h3>任务条件</h3><p class="muted">示例条件：当月有效订台达到20次，完成后退回保证金和承包金额。统计口径、目标和审核规则随合同固定；到期不会自动视为完成。</p></div><label class="check"><input type="checkbox"><span>阅读卡座合作条款及资金处理规则</span></label><div class="note">合同资金流程尚未开通；此处仅展示布局。</div>`,footer:()=>button('返回任务大厅','contracts','outline'),notes:'金额、币种、收取方和退回条件必须在付款前清楚。任务完成不同于月份到期；不得自动确认完成或伪造支付回执。'},
 partner:{group:'合作者',label:'合作者平台',title:'合作者平台',html:()=>`${identity}<div class="card"><div class="muted">本月已入账收益 · CNY</div><p class="money big">¥${money(1280)}</p><div class="row"><div><span class="muted">可提现</span><p>¥980.00</p></div><div><span class="muted">待结算</span><p>¥360.00</p></div></div><div class="buttons">${button('提现','partner')}${button('转入平台余额','partner','secondary')}</div></div><div class="grid"><button class="tile" data-go="partnerPublish"><span class="gold">＋</span><strong>发布AA邀请</strong><small>在签约卡座组局</small></button><button class="tile" data-go="contracts"><span class="gold">□</span><strong>我的签约卡座</strong><small>编号、月份和合同</small></button></div><div class="card" style="margin-top:16px">${menu('任务大厅','contracts')}${menu('我的派对','aa')}${menu('提成明细','partner')}${menu('提现明细','partner')}${menu('我的特约顾客','partner')}</div>`,notes:'保留已验收的收益和管理风格，只增加发布和签约卡座入口。没有有效合同先找合作任务，不能作为普通会员自由挑门店发布。'},
 partnerPublish:{group:'合作者',label:'编号活动发布',title:'发布AA邀请',html:()=>`<div class="step"><i></i><i></i><i></i><i></i><i></i></div><h2>在你的卡座组局</h2><p class="muted">1 / 5 · 合同编号位置</p><div class="card" style="margin-top:24px"><span class="tag">有效月签约</span><h2 style="margin-top:12px">V2卡座 · 10人</h2><p class="muted">示例门店 · 2026年11月</p>${row('活动开始','11月7日 20:00')}${row('活动结束','11月8日 02:00')}<p class="muted">场次必须完整在合同有效期内</p></div><div class="card"><h3>活动方式</h3><div class="pillrow"><button class="active">AA</button><button>男A女免</button><button>全免费</button></div><input class="field" placeholder="活动主题" aria-label="活动主题"></div>`,footer:()=>button('预览编号邀请','invitation'),notes:'合同、门店、编号固定。服务端重新核对合同状态、本人授权和场次冲突，不相信客户端传入的桌号。'},
 desk:{group:'商家',label:'预约与排位',title:'预约与排位',html:()=>`<div class="row"><span>10月17日 · 周六</span><span class="gold">选择日期</span></div><div class="tabs"><button class="active">待到店</button><button>待分座</button><button>已到店</button></div><div class="card"><span class="tag">预订产品 · 已确认</span><h3 style="margin-top:16px">V1卡座 · 6人</h3>${row('到店时间','20:00')}${row('已付定金','¥100.00')}<div class="buttons">${button('查看预约','success','outline')}${button('到店操作示例','desk')}</div></div><div class="card"><span class="tag">官方活动 · 待分座</span><h3 style="margin-top:16px">周末官方AA夜</h3>${row('已报名','18人')}${row('可安排位置','V1、V3')}<p class="muted">合同位置V2不在可安排范围</p></div>`,notes:'复用收银预约与排位，区分确认到店、分桌和消费结账。APP付款和柜台操作共用桌台及订单身份。'}
};
let active='home',history=[];
const nav=document.getElementById('nav');let group='';for(const [key,p] of Object.entries(pages)){if(group!==p.group){group=p.group;nav.insertAdjacentHTML('beforeend',`<label>${group}</label>`)}nav.insertAdjacentHTML('beforeend',`<button data-go="${key}" id="nav-${key}">${p.label}</button>`)}
function show(key,push=true){if(!pages[key])return;if(push&&key!==active)history.push(active);active=key;const p=pages[key];document.getElementById('title').textContent=p.title;document.getElementById('body').innerHTML=p.html();document.getElementById('body').scrollTop=0;document.getElementById('footer').className=p.footer?'footer':'';document.getElementById('footer').innerHTML=p.footer?.()??'';document.getElementById('noteTitle').textContent=p.label;document.getElementById('notes').innerHTML=`<p>${p.notes}</p>`;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.id==='nav-'+key));document.getElementById('back').style.visibility=history.length?'visible':'hidden'}
document.addEventListener('click',e=>{const next=e.target.closest('[data-go]');if(next)show(next.dataset.go);const option=e.target.closest('.pillrow button,.tabs button');if(option){option.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));option.classList.add('active')}});document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('[role=button]')){e.preventDefault();show(e.target.dataset.go)}});document.getElementById('back').onclick=()=>show(history.pop()??'home',false);show('home',false);
</script>
</html>
