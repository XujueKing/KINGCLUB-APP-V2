function render(y=0){chrome.innerHTML='';canvas.className='canvas screen-enter';canvas.innerHTML=page==='store'?storePage():page==='recommend'?recommendation():page==='discovery'?discovery():page==='activity'?activity():confirmation();if(page==='store'){chrome.innerHTML='<header class="head" id="store-head"><button class="icon-btn" data-back aria-label="返回">'+icons.back+'</button><h2>KING CLUB · 湖南工大店</h2><button class="icon-btn more" data-action="share" aria-label="分享店铺">↗</button></header><footer class="bottom"><button class="secondary" data-action="contact">联系商家</button><button class="'+(mode==='paused'?'closed':'primary')+'" '+(mode==='paused'?'disabled':'data-tab="booking"')+'>'+(mode==='paused'?'暂停接待':'选位置')+'</button></footer>';}else if(page==='activity')chrome.innerHTML='<button class="close-activity" data-back aria-label="关闭活动详情">×</button>';canvas.scrollTop=y;updateHeader();updateNotes();document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene));}

document.getElementById('scenes').innerHTML=views.map(([id,no,label])=>'<button class="nav-item" data-scene="'+id+'"><span>'+no+'</span>'+label+'</button>').join('');
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-route],[data-product],[data-gallery]');if(!t){if(e.target.matches('[data-dismiss]'))closeSheet();return;}if(t.disabled)return;if(t.dataset.scene){setScene(t.dataset.scene);return;}if(t.dataset.width){document.documentElement.style.setProperty('--phone',t.dataset.width+'px');document.querySelectorAll('[data-width]').forEach(b=>b.classList.toggle('active',b===t));return;}if(t.id==='font-mode'){fontLarge=!fontLarge;document.documentElement.style.setProperty('--type',fontLarge?'1.2':'1');t.textContent=fontLarge?'文字：大字 / 切换标准':'文字：标准 / 切换大字';return;}if(t.hasAttribute('data-back')){back();return;}if(t.hasAttribute('data-close')){closeSheet();return;}if(t.dataset.route){go(t.dataset.route);return;}if(t.dataset.tab){setTab(t.dataset.tab);return;}if(t.dataset.gallery){gallery(t.dataset.gallery);return;}if(t.dataset.product){product(t.dataset.product);return;}if(t.hasAttribute('data-confirm-demo')){closeSheet();go('confirmation');return;}if(t.dataset.type){positionType=t.dataset.type;render(canvas.scrollTop);return;}if(t.hasAttribute('data-event-action')){if(mode==='paused'){sheet('暂不接受新报名','<p>商家暂时停止接待，请留意后续开放信息。</p>');return;}if(page!=='activity'&&!viewed){go('activity');return;}sheet('加入活动','<p>万圣节交友奇遇夜</p><p>先查看资格、实际报价和剩余席位，再确认报名。</p><div class="alert">此处只预览与原报名流程的衔接，未创建订单或入场券。</div><button class="primary" data-close>继续浏览</button>');return;}if(t.dataset.seat){sheet(t.dataset.seat==='occupied'?'会员公开资料':'这是一个空位',t.dataset.seat==='occupied'?'<p>示例会员</p><p>正式页面只展示该会员允许公开的信息。</p>':'<p>加入活动时可自选或系统分配，具体条件以活动规则为准。</p>');return;}const a=t.dataset.action;if(a==='save'){saved=!saved;const y=canvas.scrollTop;render(y);notify(saved?'已收藏（设计预览）':'已取消收藏（设计预览）');}else if(a==='contact')sheet('联系商家','<div class="info-list"><div class="info-row"><span>在线咨询</span><span>商家暂未开通在线咨询</span></div><div class="info-row"><span>联系电话</span><span>暂未公开</span></div></div><p>你也可以查看地址和到店信息。</p><button class="secondary" data-action="map">查看到店导航</button>');else if(a==='map')sheet('到店导航','<p><b>KING CLUB · 天元区湖南工大店</b></p><p>株洲市天元区金华路瀚水栗源1栋102</p><button class="primary" data-action="map-demo">打开地图（预览）</button><p class="small">正式跳转使用门店核验后的导航位置。</p>');else if(a==='map-demo')notify('导航交互预览，未打开外部地图');else if(a==='hours')sheet('营业信息','<p>商家尚未完善营业时间。</p><p>活动开始时间请查看相应场次，预订可用时段请查看产品详情。</p>');else if(a==='date')sheet('到店日期','<p>切换日期后，查看对应场次和可订位置。</p><div class="choice">'+['10月28日 周三','10月30日 周五','10月31日 周六','11月1日 周日'].map(d=>'<button data-date="'+d+'" class="'+(date===d?'active':'')+'">'+d+'</button>').join('')+'</div>');else if(a==='guests')sheet('预订人数','<div class="choice">'+['2人','4人','6人','8人','10人','更多人数'].map(g=>'<button data-guests="'+g+'" class="'+(guests===g?'active':'')+'">'+g+'</button>').join('')+'</div>');else if(a==='share')sheet('分享这家店','<p>KING CLUB · 天元区湖南工大店</p><p>分享门店主页，让朋友一起挑活动、选位置。</p><button class="primary" data-action="share-demo">预览分享</button>');else if(a==='share-demo')notify('分享样式示意，未发送任何消息');else if(a==='my')sheet('我的活动','<p>可用活动券、历史加入活动、购买记录，继续沿用APP现有入口。</p>');else if(a==='category')notify('分类入口示意，本轮先讨论单店主页');if(t.dataset.date){date=t.dataset.date;closeSheet();render(canvas.scrollTop);}if(t.dataset.guests){guests=t.dataset.guests;closeSheet();render(canvas.scrollTop);}});
document.addEventListener('input',e=>{if(e.target.id==='store-search'){const q=e.target.value.trim().toLowerCase();document.getElementById('store-results').innerHTML=!q||'king club kingclub 天元区 湖南工大店 金华路'.includes(q)?storeSearchCard():'<div class="empty"><strong>没有找到相应店铺</strong>换个店名或商圈关键词试试。</div>';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(overlay.innerHTML)closeSheet();else back();}if(['Enter',' '].includes(e.key)&&e.target.matches('[role="button"]:not(button)')){e.preventDefault();e.target.click();}});
canvas.addEventListener('scroll',updateHeader,{passive:true});
setScene(new URLSearchParams(location.search).get('view')||'store');
</script>
