[package]
name = "kingclub-novorudp-frame-fixture"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kingclub-novorudp-frame-fixture"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

[[bin]]
name = "kingclub-novorudp-secure-probe"
path = "secure_probe.rs"
