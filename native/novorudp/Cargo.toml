[package]
name = "kingclub-novorudp-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "kingclub_novorudp"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

